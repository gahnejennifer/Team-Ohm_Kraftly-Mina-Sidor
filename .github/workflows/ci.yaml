name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # avbryt bara PR-körningar

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        id: lint
        run: npm run lint

      - name: Run Prettier format
        run: npm run format

      - name: Run Prettier check
        id: prettier
        run: npm run format:check

      - name: Run tests
        id: test
        run: npm run test:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e:cy
        env:
          E2E_SERVER: preview
          API_KEY: e2e-testnyckel # ingen hemlighet – ett API som lever två minuter på en slit-och-släng-maskin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  publish:
    name: Image → GHCR
    runs-on: ubuntu-latest
    needs: [quality, e2e] # bara kod som klarat testerna blir en image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Imagenamn
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Bygg imagen
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
      - run: docker image ls "$IMAGE" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
      - name: Logga in på GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pusha
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Be Render köra exakt den här imagen
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          : "${HOOK:?RENDER_DEPLOY_HOOK saknas i miljön staging}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "Render har tagit emot $IMAGE"
      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          : "${URL:?STAGING_URL saknas i miljön staging}"
          URL="${URL%/}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1
      - name: Röktest – går inloggningen genom proxyn?
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          URL="${URL%/}"
          curl -fsS -X POST "$URL/api/login" -H 'Content-Type: application/json' -d '{"email":"a@b.se","password":"x"}'
          echo
          echo "✅ /api svarar via nginx med nyckeln från Render"
      - name: Show image size
        run: docker image ls kraftly-frontend
